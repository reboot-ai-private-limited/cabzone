server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect HTTP to HTTPS once SSL is provisioned
    # Certbot will automatically configure SSL redirects if you use:
    # sudo certbot --nginx -d api.yourdomain.com

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (Required for /ws ride tracking & calling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets / long-lived connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Client body upload size (for KYC documents)
        client_max_body_size 25M;
    }
}
