# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION ENVIRONMENT (Full Stack in Docker)
#
#   cp apps/api/.env.prod.example apps/api/.env.prod
#   docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # Mongo port is closed from host access in production. Reachable only within compose network.
    volumes: ['mongo-data:/data/db']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - mongosh --host mongo --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    # Redis port is closed from host access in production.
    volumes: ['redis-data:/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [apps/api/.env.prod]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/cabzone_prod?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports: ['4000:4000']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [apps/api/.env.prod]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/cabzone_prod?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports: ['3000:3000']
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:4000/api
    restart: unless-stopped

volumes:
  mongo-data:
    name: cabzone-mongo-data-prod
  redis-data:
    name: cabzone-redis-data-prod
