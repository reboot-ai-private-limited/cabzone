# ─────────────────────────────────────────────────────────────────────────────
# STAGING ENVIRONMENT (Pre-Production Full Stack in Docker)
#
#   cp apps/api/.env.stage.example apps/api/.env.stage
#   NEXT_PUBLIC_API_BASE_URL=https://stage-admin.cabzone.example/api \
#     docker compose -f docker-compose.stage.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes: ['mongo-data:/data/db']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - mongosh --host mongo --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [apps/api/.env.stage]
    environment:
      NODE_ENV: stage
      MONGO_URI: mongodb://mongo:27017/Cabzonee_stage?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports: ['4000:4000']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [apps/api/.env.stage]
    environment:
      NODE_ENV: stage
      MONGO_URI: mongodb://mongo:27017/Cabzonee_stage?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'dist/worker.js']
      interval: 20s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://stage-admin.cabzone.example/api}
        API_UPSTREAM_ORIGIN: ${API_UPSTREAM_ORIGIN:-http://api:4000}
        ALLOW_NON_HTTPS_WEB_API_URL: ${ALLOW_NON_HTTPS_WEB_API_URL:-false}
    depends_on:
      api: { condition: service_healthy }
    ports: ['3000:3000']
    environment:
      # Next.js standalone runtime requires NODE_ENV=production even in staging deployments.
      NODE_ENV: production
      API_UPSTREAM_ORIGIN: ${API_UPSTREAM_ORIGIN:-http://api:4000}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
    name: Cabzonee-mongo-data-stage
  redis-data:
    name: Cabzonee-redis-data-stage
