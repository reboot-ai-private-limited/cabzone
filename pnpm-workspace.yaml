packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@scarf/scarf': false
  '@firebase/util': false
  protobufjs: false
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  mongodb-memory-server: true

minimumReleaseAgeExclude:
  - '@expo/*'
  - 'expo*'
  - 'babel-preset-expo'
  - 'eslint-config-expo'
  - 'react*'
  - '@react-native*'
  - '@types/react*'

nodeLinker: hoisted

overrides:
  react: 19.3.0
  react-dom: 19.3.0
  uuid: 14.0.2
