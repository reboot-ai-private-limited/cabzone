packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@scarf/scarf': false
  '@firebase/util': false
  protobufjs: false
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  mongodb-memory-server: true

minimumReleaseAgeExclude:
  - '@expo/*'
  - 'expo*'
  - 'babel-preset-expo'
  - 'eslint-config-expo'
  - 'react*'
  - '@react-native*'
  - '@types/react*'
  - 'next'
  - '@next/*'
  - 'postcss'
  - 'node-forge'
  - 'source-map-js'
  - 'sharp'
  - '@img/*'
  - 'body-parser'

nodeLinker: hoisted

overrides:
  react: 19.3.0
  react-dom: 19.3.0
  uuid: 14.0.2
  postcss: '>=8.5.18'
  node-forge: '>=1.4.1'
  source-map-js: '>=1.2.2'
  sharp: '>=0.35.5'
  body-parser: '>=1.20.9'

# GHSA-mrhx-c7xc-m3w5 (zod <4.6.6): mitigated by express.json({ limit: '1mb' }) payload cap on API;
# blind major upgrade to zod@4 would break @asteasolutions/zod-to-openapi@^7.3.4 and @expo/cli.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
